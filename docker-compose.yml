services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partner_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  partner-service:
    build:
      context: .
      dockerfile: src/PartnerService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=partner_service;Username=postgres;Password=postgres
      Database__UseInMemory: "false"
      Geolocalization__UseInMemory: "false"
      Geolocalization__GrpcAddress: http://geolocation-service:8080
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5114:8080"

  geolocation-service:
    build:
      context: .
      dockerfile: src/GeolocalizationService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MongoDB: mongodb://mongodb:27017
      MongoDB__DatabaseName: geolocalization
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5201:8080"

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Services__PartnerService: http://partner-service:8080
      Geolocalization__GrpcAddress: http://geolocation-service:8080
      ReverseProxy__Clusters__partner-service__Destinations__partner-service__Address: http://partner-service:8080
    depends_on:
      - partner-service
      - geolocation-service
    ports:
      - "5000:8080"

volumes:
  postgres_data:
  mongo_data:
